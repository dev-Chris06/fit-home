# À chaque envoi de code : analyse, tests, puis construction d'un APK de contrôle (téléchargeable dans
# l'onglet Actions de GitHub, rubrique « Artifacts »). Ne publie rien.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Le projet Android existe-t-il ?
        id: check
        run: |
          if [ -d android ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "En attente du workflow bootstrap."; fi

      - uses: actions/setup-java@v6
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
          # Garde les téléchargements de Gradle d'une compilation à l'autre (moins d'erreurs « 429 » de Maven).
          cache: gradle

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Dépendances
        if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      - name: Analyse du code
        if: steps.check.outputs.ready == 'true'
        run: flutter analyze --no-fatal-infos

      - name: Tests
        if: steps.check.outputs.ready == 'true'
        run: flutter test

      - name: Captures d'écran de contrôle
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: flutter test screenshots/ --update-goldens

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.ready == 'true'
        with:
          name: captures
          path: screenshots/captures/
          retention-days: 7

      - name: Bilan des dépendances (pubspec.lock et versions plus récentes)
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          mkdir -p screenshots/captures
          flutter pub outdated > screenshots/captures/dependances.txt 2>&1 || true
          # pubspec.lock avec les dernières versions compatibles, calculé à part pour ne pas changer cette compilation.
          # À recopier dans le dépôt quand dependances.txt signale des versions bloquées.
          mkdir -p /tmp/maj && cp pubspec.yaml pubspec.lock /tmp/maj/
          (cd /tmp/maj && flutter pub upgrade > /dev/null 2>&1 && cp pubspec.lock "$GITHUB_WORKSPACE/screenshots/captures/pubspec.lock.txt") || true

      - name: Publier les captures sur la branche « captures »
        if: steps.check.outputs.ready == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd screenshots/captures
          git init -q -b captures
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Captures de contrôle (${GITHUB_SHA::7})"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" captures

      - name: Clé de signature (si configurée)
        if: steps.check.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi

      - name: Construire l'APK
        if: steps.check.outputs.ready == 'true'
        run: flutter build apk --release --build-name=0.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.ready == 'true'
        with:
          name: fit-home-apk-controle
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
