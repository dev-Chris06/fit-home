# Publication automatique d'une version.
# À chaque envoi sur main, ce workflow lit la version dans pubspec.yaml (ex. « version: 1.0.1+1 » → 1.0.1).
# Si aucune release v1.0.1 n'existe encore, il construit l'APK signé et crée la release GitHub avec fit-home.apk
# et les notes de la section « ## 1.0.1 » du CHANGELOG.md. Sinon, il ne fait rien.
# C'est cette release que l'app consulte quand on appuie sur « Rechercher une mise à jour ».
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cette version est-elle déjà publiée ?
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La version $VERSION est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version à publier : $VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.v.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
          # Garde les téléchargements de Gradle d'une compilation à l'autre (moins d'erreurs « 429 » de Maven).
          cache: gradle

      - uses: subosito/flutter-action@v2
        if: steps.v.outputs.publish == 'true'
        with:
          channel: stable
          cache: true

      - name: Dépendances et tests
        if: steps.v.outputs.publish == 'true'
        run: |
          flutter pub get
          flutter test

      - name: Clé de signature
        if: steps.v.outputs.publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::La clé de signature n'est pas configurée (secrets ANDROID_*)."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Construire l'APK signé
        if: steps.v.outputs.publish == 'true'
        run: |
          # build-number : toujours croissant pour qu'Android accepte la mise à jour par-dessus l'ancienne version.
          BUILD=$(( $(date +%s) / 60 ))
          flutter build apk --release --build-name="${{ steps.v.outputs.version }}" --build-number="$BUILD"
          cp build/app/outputs/flutter-apk/app-release.apk fit-home.apk

      - name: Notes de version (depuis CHANGELOG.md)
        if: steps.v.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Version $VERSION de Fit Home." > notes.md; fi
          cat notes.md

      - name: Publier la release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          gh release create "v$VERSION" fit-home.apk --target "$GITHUB_SHA" --title "Fit Home $VERSION" --notes-file notes.md --latest
